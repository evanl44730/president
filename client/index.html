<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Président</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="login-screen">
        <h1>Le Président</h1>
        <input type="text" id="username" placeholder="Votre pseudo" autofocus>
        <button id="btn-join">Entrer dans le salon</button>
    </div>

    <div id="lobby-screen" class="hidden">
        <h2>Salle d'attente</h2>
        <p>Joueurs connectés :</p>
        <ul id="players-list">
            </ul>
        <div id="lobby-controls">
            <p id="lobby-status">En attente de joueurs...</p>
            <button id="btn-start-game" disabled>Lancer la partie (Min 2 joueurs)</button>
        </div>
    </div>

    <div id="game-board" class="hidden">
        <div id="info-bar">
             <span id="status-msg">Partie en cours</span>
        </div>
        </div>
        
        <div id="info-bar">
            <span id="status-msg">En attente d'autres joueurs...</span>
        </div>

        <div id="opponents-area">
            <div class="opponent">Adversaires connectés</div>
        </div>

        <div id="table-area">
            <div class="card-slot">
                </div>
        </div>

        <div id="my-hand">
            </div>

        <div id="controls">
            <button id="btn-play">JOUER SÉLECTION</button>
            <button id="btn-pass" class="secondary">PASSER</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
